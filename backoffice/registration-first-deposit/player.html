<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首充成长阶梯</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="launch.css"></head><body class="player-site" data-view="activity"><nav class="page-navigation" aria-label="页面导航"><a href="index.html">活动设置</a><a href="rewards.html">奖励组合</a><a href="channel-rewards.html">通道活动</a><a href="task-center.html">任务中心</a><a href="deposit-settings.html">充值优惠总览</a><a href="player.html" aria-current="page">玩家页面</a><a href="deposit.html">充值页面</a><a href="guide.html">规则说明</a><a href="presentation.html">会议简报</a></nav><main class="phone">
