<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" font-family="Microsoft JhengHei, sans-serif"><rect width="1100" height="330" rx="22" fill="#141e2b"/><rect x="28" y="28" width="510" height="274" rx="16" fill="#1d3040"/><rect x="558" y="28" width="514" height="274" rx="16" fill="#29283d"/><text x="52" y="72" fill="#8bdac8" font-size="15">01  只恢復一個專案</text><text x="52" y="116" fill="#fff" font-size="25">標題旁的 ↶ 恢復圖示</text><text x="52" y="164" fill="#b8ccdc" font-size="17">目前選項 → 該專案預設</text><text x="52" y="201" fill="#b8ccdc" font-size="17">其他修改保留</text><text x="52" y="269" fill="#8fa8bb" font-size="14">以懸停提示確認範圍；恢復後仍需發布</text><text x="582" y="72" fill="#c0b7ff" font-size="15">02  放棄這次全部修改</text><text x="582" y="116" fill="#fff" font-size="25">撤銷修改 → 確認</text><text x="582" y="164" fill="#c6c3e0" font-size="17">全部未發布修改 → 上次發布版本</text><text x="582" y="201" fill="#c6c3e0" font-size="17">保留既有已發布的客製設定</text><text x="582" y="269" fill="#a39cbc" font-size="14">不是把全站所有設定恢復成主題預設</text></svg>