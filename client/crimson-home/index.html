<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crimson home · Design review</title><style>*{box-sizing:border-box}body{margin:0;background:#121116;color:#eee;font:14px/1.6 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #34303a;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:17px;margin:0}p{margin:3px 0;color:#b4aab8;font-size:12px}nav{display:flex;gap:8px}button,a{font:inherit;border:1px solid #50404c;background:#251d26;color:#f7ecf4;text-decoration:none;padding:7px 13px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#ba0343;border-color:#ef4684}main{padding:30px 16px 50px}.device{width:min(390px,100%);margin:0 auto;border-radius:22px;overflow:hidden;outline:1px solid #583742;box-shadow:0 25px 80px #0008}iframe{width:100%;height:767px;border:0;display:block;background:#330011}.device.full{border-radius:10px}a:focus-visible,button:focus-visible{outline:2px solid #ffbf35;outline-offset:3px}</style></head><body><header><div><h1>Crimson & gold · Home review</h1><p>Standalone HTML · Artwork from your SVGs · Browser chrome omitted</p></div><nav aria-label="Preview mode"><button data-view="compact" aria-pressed="true">Compact view</button><button data-view="full" aria-pressed="false">Full page</button><a id="open-page" href="index_short.html" target="_blank">Open page ↗</a></nav></header><main><div class="device"><iframe src="index_short.html" title="Home page preview"></iframe></div></main><script>const frame=document.querySelector('iframe'),device=document.querySelector('.device');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const full=b.dataset.view==='full';frame.src=full?'index_all.html':'index_short.html';device.classList.toggle('full',full);frame.style.height=full?'2340px':'767px';document.querySelector('#open-page').href=frame.src;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='crimson-height'&&device.classList.contains('full'))frame.style.height=Math.max(767,Math.min(8000,e.data.height))+'px'});</script></body></html>
